{% extends "layout.html" %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5">
    <title>Disease Forecasting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        .card {
            border-radius: 12px;
        }
        .card .card-title {
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .card .card-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4e73df;
        }
        .icon {
            font-size: 2.5rem;
            color: #d1d3e2;
        }
    </style>
</head>
<body>

<!-- Begin Page Content -->
<div class="container py-5">

    <!-- Page Heading -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Disease Forecasting</h1>
    </div>

    <!-- Content Row -->
    <div class="row g-4">

        <!-- Temperature Card -->
        <div class="col-lg-3 col-md-6">
            <div class="card border-primary shadow h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="me-auto">
                        <p class="card-title text-primary">Temperature</p>
                        <div class="card-value text-dark">{{ temp }} &#8451;</div>
                    </div>
                    <i class="fas fa-thermometer-half icon"></i>
                </div>
            </div>
        </div>

        <!-- Humidity Card -->
        <div class="col-lg-3 col-md-6">
            <div class="card border-success shadow h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="me-auto">
                        <p class="card-title text-success">Humidity</p>
                        <div class="card-value text-dark">{{ humidity }}%</div>
                    </div>
                    <i class="fas fa-water icon"></i>
                </div>
            </div>
        </div>

        <!-- Moisture Card -->
        <div class="col-lg-3 col-md-6">
            <div class="card border-info shadow h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="me-auto">
                        <p class="card-title text-info">Soil Moisture</p>
                        <div class="card-value text-dark">{{ moisture }}%</div>
                    </div>
                    <i class="fas fa-seedling icon"></i>
                </div>
            </div>
        </div>

        <!-- Forecasted Disease Card -->
        <div class="col-lg-3 col-md-6">
            <div class="card border-warning shadow h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="me-auto">
                        <p class="card-title text-warning">Forecasted Disease</p>
                        <div class="card-value text-dark">{{ disease }}</div>
                    </div>
                    <i class="fas fa-disease icon"></i>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% endblock %}
